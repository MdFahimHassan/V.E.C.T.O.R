<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V.E.C.T.O.R. Orb</title>
<style>
  :root { --bg:#02050a; --cyan:#4fd8ff; --dim:#6b8797; }
  html, body { margin:0; height:100%; background:var(--bg); overflow:hidden;
    font-family: "Segoe UI", system-ui, sans-serif; color:var(--cyan); user-select:none; }
  canvas { position:fixed; inset:0; width:100%; height:100%; }
  #label { position:fixed; left:0; right:0; bottom:14px; text-align:center; padding:0 18px;
    letter-spacing:.32em; font-size:11px; text-transform:uppercase; color:var(--dim); }
  #caption { position:fixed; left:0; right:0; bottom:40px; text-align:center; padding:0 22px;
    font-size:14px; line-height:1.45; color:#d6f4ff; opacity:0; transition:opacity .5s;
    text-shadow:0 0 12px rgba(79,216,255,.45); }
  #caption.you { color:#8fa9b6; text-shadow:none; }
  #demo { position:fixed; top:10px; left:10px; display:none; gap:6px; flex-wrap:wrap; }
  #demo button { background:#0a1822; color:var(--cyan); border:1px solid #1b3a4d; border-radius:6px;
    padding:6px 10px; font:inherit; font-size:12px; cursor:pointer; }
  #demo button:hover { border-color:var(--cyan); }
  @media (prefers-reduced-motion: reduce) { #caption { transition:none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="demo"></div>
<div id="caption"></div>
<div id="label">V.E.C.T.O.R.</div>

<script>
// ---------- state ----------
const STATES = {
  //            radius  spin   swirl  jitter  bright  size   hue(rgb)
  idle:      { r:0.34, spin:0.10, swirl:0.0, jit:0.01, br:0.35, sz:0.9, col:[79,216,255] },
  listening: { r:0.50, spin:0.25, swirl:0.0, jit:0.03, br:0.80, sz:1.2, col:[96,226,255] },
  thinking:  { r:0.42, spin:1.30, swirl:3.2, jit:0.02, br:0.95, sz:1.15, col:[150,170,255] },
  speaking:  { r:0.50, spin:0.35, swirl:0.0, jit:0.05, br:1.00, sz:1.3, col:[120,236,255] },
};
const cur = { ...STATES.idle, col:[...STATES.idle.col] };
let state = "idle", level = 0, smoothLevel = 0, micLevel = 0;

// ---------- particles on a sphere ----------
const N = 1500;
const P = [];
for (let i = 0; i < N; i++) {                       // fibonacci sphere = even spread
  const y = 1 - (i / (N - 1)) * 2;
  const rad = Math.sqrt(1 - y * y);
  const th = Math.PI * (3 - Math.sqrt(5)) * i;
  P.push({ x: Math.cos(th) * rad, y, z: Math.sin(th) * rad, seed: Math.random() * 6.28, k: 0.6 + Math.random() * 0.8 });
}

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize); resize();

const lerp = (a, b, t) => a + (b - a) * t;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

let angle = 0, last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  const target = STATES[state];

  // ease every parameter toward the current state so changes feel organic
  const e = 1 - Math.pow(0.04, dt);
  for (const k of ["r", "spin", "swirl", "jit", "br", "sz"]) cur[k] = lerp(cur[k], target[k], e);
  for (let i = 0; i < 3; i++) cur.col[i] = lerp(cur.col[i], target.col[i], e);
  smoothLevel = lerp(smoothLevel, level, 1 - Math.pow(0.0005, dt));

  angle += dt * cur.spin * (reduce ? 0.3 : 1);
  const minSide = Math.min(W, H * 0.86);
  const cx = W / 2, cy = H * 0.46;
  const base = minSide * cur.r * 0.5;
  const breathe = 1 + 0.035 * Math.sin(t * (state === "idle" ? 1.1 : 2.2));
  const voice = state === "speaking" ? smoothLevel : 0;

  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "rgba(2,5,10,0.28)";             // slight trail = soft motion blur
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = "lighter";

  // soft core glow
  const glow = base * (1.5 + voice * 0.9);
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, glow);
  const [cr, cg, cb] = cur.col.map(Math.round);
  g.addColorStop(0, `rgba(${cr},${cg},${cb},${0.16 * cur.br + voice * 0.22})`);
  g.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const cosA = Math.cos(angle), sinA = Math.sin(angle);
  const tilt = 0.35, cosT = Math.cos(tilt), sinT = Math.sin(tilt);

  for (let i = 0; i < N; i++) {
    const p = P[i];
    // twist by latitude while thinking -> particles stream into a swirl
    const tw = cur.swirl * p.y * Math.sin(t * 0.8) + (cur.swirl ? t * 0.6 * p.k * (cur.swirl / 3.2) : 0);
    const c = Math.cos(tw), s = Math.sin(tw);
    let x = p.x * c - p.z * s, z = p.x * s + p.z * c, y = p.y;

    // radial displacement: voice pushes particles outward, uneven per particle
    const wob = Math.sin(t * 6 * p.k + p.seed * 3 + y * 4) * 0.5 + 0.5;
    const rr = breathe * (1 + cur.jit * Math.sin(t * 2 + p.seed) + voice * 0.55 * wob);
    x *= rr; y *= rr; z *= rr;

    // spin around Y, then tilt around X
    const x2 = x * cosA - z * sinA, z2 = x * sinA + z * cosA;
    const y3 = y * cosT - z2 * sinT, z3 = y * sinT + z2 * cosT;

    const persp = 1 / (1.9 - z3 * 0.55);
    const px = cx + x2 * base * persp * 1.9, py = cy + y3 * base * persp * 1.9;
    const depth = (z3 + 1) / 2;                     // 0 back .. 1 front
    const a = (0.12 + depth * 0.7) * cur.br * (0.75 + 0.25 * wob);
    const size = (0.5 + depth * 1.4) * cur.sz * (1 + voice * 0.8 * wob) * persp * 1.9;

    ctx.fillStyle = `rgba(${cr},${cg},${cb},${a.toFixed(3)})`;
    ctx.fillRect(px - size / 2, py - size / 2, size, size);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// Esc hides the orb window (only does anything inside the Vector window)
addEventListener("keydown", e => { if (e.key === "Escape" && window.pywebview) window.pywebview.api.hide(); });

// ---------- text under the orb ----------
const cap = document.getElementById("caption"), label = document.getElementById("label");
let capTimer;
function caption(text, who) {
  cap.textContent = text;
  cap.className = who === "you" ? "you" : "";
  cap.style.opacity = text ? 1 : 0;
  clearTimeout(capTimer);
  if (text) capTimer = setTimeout(() => (cap.style.opacity = 0), 7000);
}
function setState(s) { if (STATES[s]) { state = s; label.textContent = s === "idle" ? "V.E.C.T.O.R." : s; } }

// ---------- events from vector.py ----------
function handle(m) {
  if (m.state) setState(m.state);
  if (typeof m.level === "number") level = m.level;
  if (m.text !== undefined && m.text !== null) caption(m.text, m.who);
}

const port = new URLSearchParams(location.search).get("port") || "8765";
let demoStarted = false;
function connect() {
  let ws;
  try { ws = new WebSocket(`ws://127.0.0.1:${port}`); } catch { return startDemo(); }
  ws.onmessage = ev => { try { handle(JSON.parse(ev.data)); } catch {} };
  ws.onopen = () => { document.getElementById("demo").style.display = "none"; };
  ws.onclose = () => { setTimeout(connect, 1500); if (!demoStarted) setTimeout(startDemo, 1200); };
}
connect();

// ---------- demo mode: only when Vector isn't running ----------
function startDemo() {
  if (demoStarted) return; demoStarted = true;
  const box = document.getElementById("demo"); box.style.display = "flex";
  const sim = { talking: false };
  for (const s of Object.keys(STATES)) {
    const b = document.createElement("button"); b.textContent = s;
    b.onclick = () => { sim.talking = s === "speaking"; setState(s);
      if (s === "speaking") caption("Good morning, sir. All systems are running normally.", "vector");
      if (s === "listening") caption("Set a timer for ten minutes", "you"); };
    box.appendChild(b);
  }
  setInterval(() => { if (sim.talking) level = Math.max(0, Math.min(1, 0.35 + 0.3 * Math.sin(performance.now() / 90) + (Math.random() - 0.5) * 0.35)); else level = 0; }, 40);
}
</script>
</body>
</html>
